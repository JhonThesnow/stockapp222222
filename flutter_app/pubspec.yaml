name: stock_pos_app
description: "Sistema POS y Control de Stock multiplataforma (Desktop & Mobile) para comercios minoristas."
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Gestión de Estado e Inyección de Dependencias ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Navegación ---
  go_router: ^14.6.2

  # --- Networking & API ---
  dio: ^5.7.0

  # --- Almacenamiento Local y Seguro ---
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # --- Modelos Inmutables & Serialización ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- Formateo Regional (ARS / Fechas) & Utilidades ---
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.18.0

  # --- Hardware: Escáner de Código de Barras & Audio ---
  mobile_scanner: ^6.0.2
  audioplayers: ^6.1.0

  # --- Impresión Térmica (58mm/80mm), PDF & Etiquetas de Código de Barras ---
  pdf: ^3.11.1
  printing: ^5.13.4
  barcode: ^2.2.8
  barcode_widget: ^2.0.4
  path_provider: ^2.1.5

  # --- UI, Gráficos de Reportes & Iconografía ---
  fl_chart: ^0.69.2
  lucide_icons_flutter: ^3.1.25
  google_fonts: ^6.2.1

  # --- Integración Desktop (Windows / macOS / Linux) ---
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.2

flutter:
  uses-material-design: true
